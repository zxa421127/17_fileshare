services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pm_knowledge
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: pm_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_user -d pm_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pm_minio
      MINIO_ROOT_PASSWORD: pm_minio_change_me
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    image: python:3.12
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://pm_user:pm_password@postgres:5432/pm_knowledge
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: pm_minio
      MINIO_SECRET_KEY: pm_minio_change_me
      MINIO_SECURE: "false"
      MINIO_BUCKET: pm-knowledge
    command: bash -c "pip install -r requirements.txt && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  minio_data:
